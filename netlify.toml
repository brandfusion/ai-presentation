# Netlify Configuration for Web-Native Presentation

[build]
  # Publish directory is the repository root
  publish = "."

# Optimized headers for Markdown and static presentation assets
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Explicit content type and short cache for slides.md so updates take effect immediately
[[headers]]
  for = "/slides.md"
  [headers.values]
    Content-Type = "text/markdown; charset=utf-8"
    Cache-Control = "no-cache, no-store, must-revalidate"

# Cache vendor & assets
[[headers]]
  for = "/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
